<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OceanBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0077b6;
            --secondary-blue: #00b4d8;
            --accent-orange: #ff7b25;
            --light-bg: #f8f9fa;
            --dark-text: #343a40;
        }
        
        body {
         
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url(assets/img/menu/kli.jpg);
             backdrop-filter: blur(3px);
             height: 700px;
            -webkit-backdrop-filter: blur(3px);
        }
        
        .login-container {
            max-width: 500px;
            margin: 80px auto;
            padding: 40px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header img {
            height: 60px;
            margin-bottom: 15px;
        }
        
        .login-header h2 {
            color: var(--primary-blue);
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #6c757d;
        }
        
        .form-control {
            height: 45px;
            margin-bottom: 20px;
        }
        
        .form-control:focus {
            border-color: var(--secondary-blue);
            box-shadow: 0 0 0 0.25rem rgba(0, 180, 216, 0.25);
        }
        
        .btn-login {
            background-color: var(--primary-blue);
            border: none;
            height: 45px;
            font-weight: 600;
            width: 100%;
        }
        
        .btn-login:hover {
            background-color: var(--secondary-blue);
        }
        
        .social-login {
            position: relative;
            margin: 30px 0;
            text-align: center;
        }
        
        .social-login::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #dee2e6;
            z-index: 1;
        }
        
        .social-login span {
            position: relative;
            z-index: 2;
            background-color: white;
            padding: 0 15px;
            color: #6c757d;
        }
        
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            transition: all 0.3s ease;
        }
        
        .social-btn:hover {
            transform: translateY(-3px);
        }
        
        .btn-facebook {
            background-color: #3b5998;
        }
        
        .btn-google {
            background-color: #db4437;
        }
        
        .btn-apple {
            background-color: #000;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
        }
        
        .login-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-footer a:hover {
            color: var(--secondary-blue);
        }
        
        .nav-back {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        
        @media (max-width: 576px) {
            .login-container {
                margin: 40px 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" style="background-color: #fff8f8;display: block;font-weight:bold;color:  rgb(131, 6, 6);"  class="nav-back btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i> Back to Home
        </a>
        <div class="login-container">
            <div class="login-header">
                <img src="assets/img/log.png" alt="OceanBite Logo">
                <h2>Welcome Back</h2>
                <p>Sign in to access your orders and preferences</p>
            </div>
            
            <form id="loginForm" action="login.php" method="POST">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" name="email" placeholder="Email address" required>
                    <label for="email">Email address</label>
                </div>
                
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>
                
                
                <button type="submit" name="btnsubmit" class="btn btn-primary btn-login">Sign In</button>
         
                <div class="login-footer">
                    Don't have an account? <a href="register.html">Sign up</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
